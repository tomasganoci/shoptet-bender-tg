# Staví základní image náhledu a publikuje ho do GHCR.
# Repo je veřejné, takže GitHub-hosted runner minuty neplatí.
name: image-nahled

on:
  push:
    branches: [master, main]
    paths:
      - 'docker/**'
      - '*.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/image-nahled.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.zaklad
          push: true
          tags: |
            ghcr.io/tomasganoci/bender-nahled:1
            ghcr.io/tomasganoci/bender-nahled:latest
            ghcr.io/tomasganoci/bender-nahled:${{ github.sha }}
